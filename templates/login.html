<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한울생명 - 로그인</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 56px; height: 56px;
      background: #185FA5;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .logo-icon svg { width: 28px; height: 28px; fill: white; }
    .logo h1 { font-size: 20px; font-weight: 600; color: #1a1a2e; }
    .logo p { font-size: 13px; color: #888; margin-top: 4px; }
 
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }
    .field input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
      color: #1a1a2e;
    }
    .field input:focus { border-color: #185FA5; }
 
    .error {
      background: #fff0f0;
      border: 1px solid #ffd0d0;
      color: #c0392b;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
    }
 
    .btn {
      width: 100%;
      padding: 13px;
      background: #185FA5;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
      margin-top: 4px;
    }
    .btn:hover { background: #0C447C; }
 
    .hint {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #aaa;
    }
    .hint span { color: #185FA5; font-weight: 500; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.35C17.25 22.15 21 17.25 21 12V7L12 2z"/></svg>
      </div>
      <h1>한울생명</h1>
      <p>온라인 보험 청약 서비스</p>
    </div>
 
    {% if success %}
    <div style="background:#e8f5e9;border:1px solid #a5d6a7;color:#2e7d32;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px">{{ success }}</div>
    {% endif %}
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
 
    <form method="post" action="/login">
      <div class="field">
        <label>아이디</label>
        <input type="text" name="user_id" placeholder="아이디를 입력하세요" required autofocus>
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" name="password" placeholder="비밀번호를 입력하세요" required>
      </div>
      <button type="submit" class="btn">로그인</button>
    </form>
 
    <div class="hint">테스트 계정: <span>admin / 1234</span></div>
    <div style="text-align:center;margin-top:14px;font-size:13px;color:#888">계정이 없으신가요? <a href="/register" style="color:#185FA5;font-weight:500;text-decoration:none">회원가입</a></div>
  </div>
</body>
</html>
